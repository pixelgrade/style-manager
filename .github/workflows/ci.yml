name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**

jobs:
  js-build:
    name: JS Build (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile production assets
        run: npm run compile:production

      - name: List gulp tasks
        run: npm run gulp -- --tasks-simple

  php-checks:
    name: PHP Checks (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.2"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install composer dependencies (no scripts)
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Build optimized autoloader (no-dev)
        run: composer dump-autoload --no-dev --optimize

  zip-build:
    name: Zip Build Artifact
    runs-on: ubuntu-latest
    needs:
      - js-build
      - php-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          tools: composer:v2
          coverage: none

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Install dependencies
        run: npm ci

      - name: Build release zip
        run: npm run zip

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: style-manager-zip
          path: ../style-manager-*.zip
          if-no-files-found: error
