<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Font Palette Card Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Lora:wght@400;700&family=Merriweather:wght@300;400;700&family=Montserrat:wght@100;200;300;400;700&family=Open+Sans:wght@300;400;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Playfair+Display:wght@400;700;900&family=Roboto:wght@300;400;500;700&family=Source+Sans+3:wght@300;400;600;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ui-bg: #1a1a1e;
    --ui-surface: #26262b;
    --ui-border: #3a3a40;
    --ui-text: #d4d4d8;
    --ui-text-dim: #8888;
    --ui-accent: #6366f1;
    --ui-font: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    --ui-mono: "SF Mono", "Cascadia Code", "JetBrains Mono", monospace;
  }

  body {
    font-family: var(--ui-font);
    background: var(--ui-bg);
    color: var(--ui-text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* === CONTROLS PANEL === */
  .controls {
    width: 320px;
    min-width: 320px;
    background: var(--ui-surface);
    border-right: 1px solid var(--ui-border);
    overflow-y: auto;
    padding: 16px;
  }

  .controls h1 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .controls .subtitle {
    font-size: 11px;
    color: var(--ui-text-dim);
    margin-bottom: 16px;
  }

  .group {
    margin-bottom: 16px;
    border-bottom: 1px solid var(--ui-border);
    padding-bottom: 12px;
  }

  .group:last-child { border-bottom: none; }

  .group-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ui-text-dim);
    margin-bottom: 8px;
    font-weight: 600;
  }

  .control-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
    gap: 8px;
  }

  .control-row label {
    font-size: 12px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .control-row input[type="range"] {
    flex: 1;
    max-width: 120px;
    accent-color: var(--ui-accent);
  }

  .control-row .val {
    font-size: 10px;
    font-family: var(--ui-mono);
    color: var(--ui-text-dim);
    min-width: 32px;
    text-align: right;
  }

  .control-row select {
    background: var(--ui-bg);
    color: var(--ui-text);
    border: 1px solid var(--ui-border);
    border-radius: 4px;
    padding: 3px 6px;
    font-size: 11px;
    flex: 1;
    max-width: 140px;
  }

  .control-row input[type="text"] {
    background: var(--ui-bg);
    color: var(--ui-text);
    border: 1px solid var(--ui-border);
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 11px;
    flex: 1;
    max-width: 160px;
  }

  .control-row input[type="checkbox"] {
    accent-color: var(--ui-accent);
  }

  /* Presets */
  .presets {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 12px;
  }

  .preset-btn {
    background: var(--ui-bg);
    color: var(--ui-text);
    border: 1px solid var(--ui-border);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
    font-family: var(--ui-font);
    transition: border-color 0.15s;
  }

  .preset-btn:hover {
    border-color: var(--ui-accent);
    color: #fff;
  }

  .preset-btn.active {
    border-color: var(--ui-accent);
    background: var(--ui-accent);
    color: #fff;
  }

  /* === PREVIEW + OUTPUT PANEL === */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .preview-wrap {
    flex: 1;
    overflow-y: auto;
    display: flex;
    justify-content: center;
    padding: 24px;
    background: #2a2a2f;
  }

  .preview-container {
    width: 320px;
    min-width: 320px;
    max-width: 320px;
  }

  .preview-header {
    font-size: 11px;
    color: var(--ui-text-dim);
    margin-bottom: 8px;
    text-align: center;
    font-weight: 500;
  }

  /* The actual cards */
  .card-list {
    display: flex;
    flex-direction: column;
    gap: 0; /* managed by JS */
  }

  .card-list.grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }

  .palette-card {
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .palette-card.selected {
    box-shadow: 0 0 0 2px var(--ui-accent);
  }

  .palette-card .watermark {
    position: absolute;
    pointer-events: none;
    line-height: 1;
    opacity: 0.06;
  }

  .palette-card .card-heading {
    position: relative;
    z-index: 1;
  }

  .palette-card .card-body {
    position: relative;
    z-index: 1;
  }

  .palette-card .palette-name {
    position: absolute;
    z-index: 2;
    font-family: var(--ui-font);
    color: #999;
  }

  .palette-card .palette-name-above {
    position: relative;
    font-family: var(--ui-font);
    color: #999;
  }

  /* === OUTPUT === */
  .output {
    background: var(--ui-surface);
    border-top: 1px solid var(--ui-border);
    padding: 12px 16px;
    max-height: 180px;
    overflow-y: auto;
  }

  .output-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 6px;
  }

  .output-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ui-text-dim);
    font-weight: 600;
  }

  .copy-btn {
    background: var(--ui-accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 4px 12px;
    font-size: 11px;
    cursor: pointer;
    font-family: var(--ui-font);
    transition: opacity 0.15s;
  }

  .copy-btn:hover { opacity: 0.85; }

  .output pre {
    font-family: var(--ui-mono);
    font-size: 11px;
    color: var(--ui-text);
    white-space: pre-wrap;
    line-height: 1.5;
  }
</style>
</head>
<body>

<!-- CONTROLS -->
<div class="controls">
  <h1>Font Palette Cards</h1>
  <p class="subtitle">Explore preview card designs for the WP Customizer sidebar</p>

  <!-- PRESETS -->
  <div class="group">
    <div class="group-title">Presets</div>
    <div class="presets">
      <button class="preset-btn" onclick="applyPreset('current')">Current</button>
      <button class="preset-btn" onclick="applyPreset('squarespace')">Squarespace</button>
      <button class="preset-btn" onclick="applyPreset('minimal')">Minimal</button>
      <button class="preset-btn" onclick="applyPreset('specimen')">Specimen</button>
      <button class="preset-btn" onclick="applyPreset('compact')">Compact</button>
      <button class="preset-btn" onclick="applyPreset('editorial')">Editorial</button>
      <button class="preset-btn" onclick="applyPreset('hybrid')">Hybrid</button>
    </div>
  </div>

  <!-- LAYOUT -->
  <div class="group">
    <div class="group-title">Layout</div>
    <div class="control-row">
      <label>Columns</label>
      <select id="c-columns" onchange="setState('columns', this.value)">
        <option value="1">Single column</option>
        <option value="2">2-column grid</option>
      </select>
    </div>
    <div class="control-row">
      <label>Card gap</label>
      <input type="range" id="c-gap" min="0" max="16" value="8" oninput="setState('gap', +this.value)">
      <span class="val" id="v-gap">8px</span>
    </div>
    <div class="control-row">
      <label>Padding</label>
      <input type="range" id="c-padding" min="8" max="28" value="16" oninput="setState('padding', +this.value)">
      <span class="val" id="v-padding">16px</span>
    </div>
    <div class="control-row">
      <label>Background</label>
      <select id="c-bg" onchange="setState('bg', this.value)">
        <option value="#ffffff">White</option>
        <option value="#f5f5f5" selected>Light gray</option>
        <option value="#f0f0f0">Medium gray</option>
        <option value="#1a1a1e">Dark</option>
      </select>
    </div>
    <div class="control-row">
      <label>Border</label>
      <select id="c-border" onchange="setState('border', this.value)">
        <option value="1px solid #e0e0e0">Subtle</option>
        <option value="2px solid #ccc" selected>Medium</option>
        <option value="2px solid #999">Strong</option>
        <option value="none">None</option>
      </select>
    </div>
    <div class="control-row">
      <label>Radius</label>
      <input type="range" id="c-radius" min="0" max="12" value="4" oninput="setState('radius', +this.value)">
      <span class="val" id="v-radius">4px</span>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="group">
    <div class="group-title">Content</div>
    <div class="control-row">
      <label>Mode</label>
      <select id="c-contentMode" onchange="setState('contentMode', this.value)">
        <option value="same" selected>Same text (compare)</option>
        <option value="named">Palette name + desc</option>
        <option value="namedSame">Name heading + same body</option>
      </select>
    </div>
    <div class="control-row" id="row-heading">
      <label>Heading</label>
      <input type="text" id="c-heading" value="Heading" oninput="setState('heading', this.value)">
    </div>
    <div class="control-row" id="row-body">
      <label>Body</label>
      <input type="text" id="c-body" value="This is your paragraph." oninput="setState('body', this.value)">
    </div>
    <div class="control-row">
      <label>Heading size</label>
      <input type="range" id="c-headingSize" min="16" max="40" value="26" oninput="setState('headingSize', +this.value)">
      <span class="val" id="v-headingSize">26px</span>
    </div>
    <div class="control-row">
      <label>Body size</label>
      <input type="range" id="c-bodySize" min="9" max="16" value="13" oninput="setState('bodySize', +this.value)">
      <span class="val" id="v-bodySize">13px</span>
    </div>
    <div class="control-row">
      <label>Body color</label>
      <select id="c-bodyColor" onchange="setState('bodyColor', this.value)">
        <option value="#666">Gray</option>
        <option value="#999">Light gray</option>
        <option value="#333">Dark</option>
      </select>
    </div>
    <div class="control-row">
      <label>Heading spacing</label>
      <input type="range" id="c-headingGap" min="0" max="12" value="4" oninput="setState('headingGap', +this.value)">
      <span class="val" id="v-headingGap">4px</span>
    </div>
  </div>

  <!-- WATERMARK -->
  <div class="group">
    <div class="group-title">Watermark Letter</div>
    <div class="control-row">
      <label>Show watermark</label>
      <input type="checkbox" id="c-watermark" checked onchange="setState('watermark', this.checked)">
    </div>
    <div class="control-row">
      <label>Character</label>
      <select id="c-watermarkChar" onchange="setState('watermarkChar', this.value)">
        <option value="A">A (same for all)</option>
        <option value="initial">Initial letter (P, A, C...)</option>
        <option value="Aa">Aa</option>
      </select>
    </div>
    <div class="control-row">
      <label>Opacity</label>
      <input type="range" id="c-watermarkOpacity" min="1" max="15" value="5" oninput="setState('watermarkOpacity', +this.value)">
      <span class="val" id="v-watermarkOpacity">5%</span>
    </div>
    <div class="control-row">
      <label>Size</label>
      <input type="range" id="c-watermarkSize" min="60" max="160" value="100" oninput="setState('watermarkSize', +this.value)">
      <span class="val" id="v-watermarkSize">100px</span>
    </div>
    <div class="control-row">
      <label>Position</label>
      <select id="c-watermarkPos" onchange="setState('watermarkPos', this.value)">
        <option value="right-center" selected>Right center</option>
        <option value="right-bottom">Right bottom</option>
        <option value="left-center">Left center</option>
        <option value="center">Center</option>
      </select>
    </div>
  </div>

  <!-- PALETTE NAME -->
  <div class="group">
    <div class="group-title">Palette Name Label</div>
    <div class="control-row">
      <label>Show name</label>
      <input type="checkbox" id="c-showName" checked onchange="setState('showName', this.checked)">
    </div>
    <div class="control-row">
      <label>Position</label>
      <select id="c-namePos" onchange="setState('namePos', this.value)">
        <option value="above">Above card</option>
        <option value="top-left">Top left (inside)</option>
        <option value="top-right">Top right (inside)</option>
        <option value="bottom-left">Bottom left (inside)</option>
        <option value="bottom-right">Bottom right (inside)</option>
      </select>
    </div>
    <div class="control-row">
      <label>Size</label>
      <input type="range" id="c-nameSize" min="8" max="13" value="10" oninput="setState('nameSize', +this.value)">
      <span class="val" id="v-nameSize">10px</span>
    </div>
    <div class="control-row">
      <label>Style</label>
      <select id="c-nameStyle" onchange="setState('nameStyle', this.value)">
        <option value="uppercase-600">Uppercase bold</option>
        <option value="uppercase-400" selected>Uppercase normal</option>
        <option value="normal-600">Normal bold</option>
        <option value="normal-400">Normal regular</option>
        <option value="normal-300">Normal light</option>
      </select>
    </div>
    <div class="control-row">
      <label>Color</label>
      <select id="c-nameColor" onchange="setState('nameColor', this.value)">
        <option value="#999" selected>Gray</option>
        <option value="#bbb">Light gray</option>
        <option value="#666">Dark gray</option>
        <option value="#333">Near black</option>
      </select>
    </div>
  </div>
</div>

<!-- MAIN AREA -->
<div class="main">
  <div class="preview-wrap">
    <div class="preview-container">
      <div class="preview-header">Customizer Sidebar Preview (320px)</div>
      <div id="card-list" class="card-list"></div>
    </div>
  </div>

  <div class="output">
    <div class="output-header">
      <span class="output-title">Configuration</span>
      <button class="copy-btn" onclick="copyOutput()">Copy Settings</button>
    </div>
    <pre id="output-text"></pre>
  </div>
</div>

<script>
const PALETTES = [
  { name: 'Pile',    desc: 'A bold clarity grounded in refined detail.',            headingFont: "'Montserrat', sans-serif",         headingWeight: 700, bodyFont: "'Montserrat', sans-serif",           bodyWeight: 200, headingTransform: 'uppercase', headingSpacing: '0.01em' },
  { name: 'Atlas',   desc: 'Driven and inspired by simple and bold.',               headingFont: "'Lora', serif",                    headingWeight: 700, bodyFont: "'PT Serif', serif",                  bodyWeight: 400, headingTransform: 'none',      headingSpacing: '0' },
  { name: 'Capitol', desc: 'Driven and inspired by simple and bold.',               headingFont: "'Playfair Display', serif",        headingWeight: 700, bodyFont: "'Source Sans 3', sans-serif",        bodyWeight: 300, headingTransform: 'none',      headingSpacing: '0' },
  { name: 'Felt',    desc: 'A sense of tradition and warmth.',                      headingFont: "'Libre Baskerville', serif",       headingWeight: 700, bodyFont: "'Source Sans 3', sans-serif",        bodyWeight: 400, headingTransform: 'none',      headingSpacing: '0' },
  { name: 'Rosa',    desc: 'Elegance meets approachable warmth.',                   headingFont: "'Work Sans', sans-serif",          headingWeight: 600, bodyFont: "'Merriweather', serif",              bodyWeight: 300, headingTransform: 'none',      headingSpacing: '0' },
  { name: 'Starter', desc: 'A clean and versatile starting point.',                 headingFont: "'Roboto', sans-serif",             headingWeight: 500, bodyFont: "'Open Sans', sans-serif",            bodyWeight: 300, headingTransform: 'none',      headingSpacing: '0' },
];

const DEFAULTS = {
  columns: '1',
  gap: 8,
  padding: 16,
  bg: '#f5f5f5',
  border: '2px solid #ccc',
  radius: 4,
  contentMode: 'same',
  heading: 'Heading',
  body: 'This is your paragraph.',
  headingSize: 26,
  bodySize: 13,
  bodyColor: '#666',
  headingGap: 4,
  watermark: true,
  watermarkChar: 'A',
  watermarkOpacity: 5,
  watermarkSize: 100,
  watermarkPos: 'right-center',
  showName: true,
  namePos: 'above',
  nameSize: 10,
  nameStyle: 'uppercase-400',
  nameColor: '#999',
};

const state = { ...DEFAULTS };

const PRESETS = {
  current: {
    columns: '1', gap: 8, padding: 16, bg: '#f5f5f5', border: '2px solid #ccc', radius: 4,
    contentMode: 'named', heading: 'Heading', body: 'This is your paragraph.', headingSize: 28, bodySize: 13, bodyColor: '#666', headingGap: 4,
    watermark: true, watermarkChar: 'A', watermarkOpacity: 5, watermarkSize: 100, watermarkPos: 'right-center',
    showName: false, namePos: 'above', nameSize: 10, nameStyle: 'uppercase-400', nameColor: '#999',
  },
  squarespace: {
    columns: '1', gap: 12, padding: 16, bg: '#f5f5f5', border: 'none', radius: 6,
    contentMode: 'same', heading: 'Heading', body: 'This is your paragraph.', headingSize: 28, bodySize: 13, bodyColor: '#666', headingGap: 4,
    watermark: false, watermarkChar: 'A', watermarkOpacity: 5, watermarkSize: 100, watermarkPos: 'right-center',
    showName: true, namePos: 'above', nameSize: 11, nameStyle: 'normal-400', nameColor: '#333',
  },
  minimal: {
    columns: '1', gap: 6, padding: 14, bg: '#ffffff', border: '1px solid #e0e0e0', radius: 3,
    contentMode: 'same', heading: 'Heading', body: 'This is your paragraph.', headingSize: 24, bodySize: 12, bodyColor: '#999', headingGap: 3,
    watermark: false, watermarkChar: 'A', watermarkOpacity: 4, watermarkSize: 80, watermarkPos: 'right-center',
    showName: true, namePos: 'top-right', nameSize: 9, nameStyle: 'uppercase-400', nameColor: '#bbb',
  },
  specimen: {
    columns: '1', gap: 8, padding: 18, bg: '#f5f5f5', border: '2px solid #ccc', radius: 4,
    contentMode: 'same', heading: 'The quick fox', body: 'The quick brown fox jumps over the lazy dog.', headingSize: 26, bodySize: 12, bodyColor: '#666', headingGap: 6,
    watermark: true, watermarkChar: 'Aa', watermarkOpacity: 4, watermarkSize: 90, watermarkPos: 'right-center',
    showName: true, namePos: 'bottom-right', nameSize: 9, nameStyle: 'uppercase-400', nameColor: '#bbb',
  },
  compact: {
    columns: '2', gap: 6, padding: 12, bg: '#f5f5f5', border: '1px solid #e0e0e0', radius: 4,
    contentMode: 'same', heading: 'Heading', body: 'Your paragraph text.', headingSize: 20, bodySize: 11, bodyColor: '#888', headingGap: 2,
    watermark: false, watermarkChar: 'A', watermarkOpacity: 4, watermarkSize: 60, watermarkPos: 'right-center',
    showName: true, namePos: 'bottom-left', nameSize: 8, nameStyle: 'uppercase-400', nameColor: '#bbb',
  },
  editorial: {
    columns: '1', gap: 10, padding: 20, bg: '#ffffff', border: '2px solid #ccc', radius: 0,
    contentMode: 'same', heading: 'Heading', body: 'This is your paragraph.', headingSize: 30, bodySize: 14, bodyColor: '#555', headingGap: 6,
    watermark: true, watermarkChar: 'initial', watermarkOpacity: 3, watermarkSize: 130, watermarkPos: 'right-bottom',
    showName: true, namePos: 'above', nameSize: 10, nameStyle: 'uppercase-600', nameColor: '#999',
  },
  hybrid: {
    columns: '1', gap: 8, padding: 16, bg: '#f5f5f5', border: '2px solid #ccc', radius: 4,
    contentMode: 'namedSame', heading: 'Heading', body: 'This is your paragraph.', headingSize: 26, bodySize: 12, bodyColor: '#666', headingGap: 4,
    watermark: true, watermarkChar: 'A', watermarkOpacity: 4, watermarkSize: 90, watermarkPos: 'right-center',
    showName: false, namePos: 'above', nameSize: 10, nameStyle: 'uppercase-400', nameColor: '#999',
  },
};

function setState(key, value) {
  state[key] = value;
  // Clear active preset
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  updateAll();
}

function applyPreset(name) {
  const p = PRESETS[name];
  if (!p) return;
  Object.assign(state, p);
  syncControls();
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.toggle('active', b.textContent.toLowerCase() === name));
  updateAll();
}

function syncControls() {
  document.getElementById('c-columns').value = state.columns;
  document.getElementById('c-gap').value = state.gap;
  document.getElementById('c-padding').value = state.padding;
  document.getElementById('c-bg').value = state.bg;
  document.getElementById('c-border').value = state.border;
  document.getElementById('c-radius').value = state.radius;
  document.getElementById('c-contentMode').value = state.contentMode;
  document.getElementById('c-heading').value = state.heading;
  document.getElementById('c-body').value = state.body;
  document.getElementById('c-headingSize').value = state.headingSize;
  document.getElementById('c-bodySize').value = state.bodySize;
  document.getElementById('c-bodyColor').value = state.bodyColor;
  document.getElementById('c-headingGap').value = state.headingGap;
  document.getElementById('c-watermark').checked = state.watermark;
  document.getElementById('c-watermarkChar').value = state.watermarkChar;
  document.getElementById('c-watermarkOpacity').value = state.watermarkOpacity;
  document.getElementById('c-watermarkSize').value = state.watermarkSize;
  document.getElementById('c-watermarkPos').value = state.watermarkPos;
  document.getElementById('c-showName').checked = state.showName;
  document.getElementById('c-namePos').value = state.namePos;
  document.getElementById('c-nameSize').value = state.nameSize;
  document.getElementById('c-nameStyle').value = state.nameStyle;
  document.getElementById('c-nameColor').value = state.nameColor;
  updateValueDisplays();
}

function updateValueDisplays() {
  document.getElementById('v-gap').textContent = state.gap + 'px';
  document.getElementById('v-padding').textContent = state.padding + 'px';
  document.getElementById('v-radius').textContent = state.radius + 'px';
  document.getElementById('v-headingSize').textContent = state.headingSize + 'px';
  document.getElementById('v-bodySize').textContent = state.bodySize + 'px';
  document.getElementById('v-headingGap').textContent = state.headingGap + 'px';
  document.getElementById('v-watermarkOpacity').textContent = state.watermarkOpacity + '%';
  document.getElementById('v-watermarkSize').textContent = state.watermarkSize + 'px';
  document.getElementById('v-nameSize').textContent = state.nameSize + 'px';
}

function getWatermarkChar(palette) {
  if (state.watermarkChar === 'initial') return palette.name.charAt(0);
  return state.watermarkChar;
}

function getWatermarkPosition() {
  switch (state.watermarkPos) {
    case 'right-center': return 'right: 6px; top: 50%; transform: translateY(-50%);';
    case 'right-bottom': return 'right: 6px; bottom: -10px;';
    case 'left-center': return 'left: 6px; top: 50%; transform: translateY(-50%);';
    case 'center': return 'left: 50%; top: 50%; transform: translate(-50%, -50%);';
    default: return 'right: 6px; top: 50%; transform: translateY(-50%);';
  }
}

function getNamePositionStyle() {
  switch (state.namePos) {
    case 'top-left': return 'top: 6px; left: 8px;';
    case 'top-right': return 'top: 6px; right: 8px;';
    case 'bottom-left': return 'bottom: 6px; left: 8px;';
    case 'bottom-right': return 'bottom: 6px; right: 8px;';
    default: return '';
  }
}

function getNameStyleCSS() {
  const [transform, weight] = state.nameStyle.split('-');
  return `text-transform: ${transform === 'uppercase' ? 'uppercase' : 'none'}; font-weight: ${weight}; letter-spacing: ${transform === 'uppercase' ? '0.06em' : '0'};`;
}

function getTextColor() {
  return state.bg === '#1a1a1e' ? '#e8e8e8' : '#222';
}

function getBodyTextColor() {
  if (state.bg === '#1a1a1e') {
    // Map light-theme body colors to dark-theme equivalents
    if (state.bodyColor === '#333') return '#ccc';
    if (state.bodyColor === '#666') return '#aaa';
    return '#888';
  }
  return state.bodyColor;
}

function getNameColor() {
  if (state.bg === '#1a1a1e') return '#777';
  return state.nameColor;
}

function renderPreview() {
  const list = document.getElementById('card-list');
  list.className = 'card-list' + (state.columns === '2' ? ' grid-2' : '');
  list.style.gap = state.gap + 'px';

  let html = '';
  PALETTES.forEach((p, i) => {
    const nameAbove = state.showName && state.namePos === 'above';
    const nameInside = state.showName && state.namePos !== 'above';

    if (nameAbove) {
      html += `<div style="margin-bottom: 2px; ${i > 0 ? 'margin-top: ' + (state.gap > 4 ? 4 : 0) + 'px;' : ''}">`;
      html += `<span style="font-size: ${state.nameSize}px; ${getNameStyleCSS()} color: ${getNameColor()}; font-family: var(--ui-font);">${p.name}</span>`;
    }

    html += `<div class="palette-card${i === 0 ? ' selected' : ''}" onclick="selectPaletteCard(this)" style="
      padding: ${state.padding}px;
      background: ${state.bg};
      border: ${state.border};
      border-radius: ${state.radius}px;
    ">`;

    // Watermark
    if (state.watermark) {
      html += `<span class="watermark" style="
        font-family: ${p.headingFont};
        font-weight: ${p.headingWeight};
        font-size: ${state.watermarkSize}px;
        opacity: ${state.watermarkOpacity / 100};
        color: ${getTextColor()};
        ${getWatermarkPosition()}
      ">${getWatermarkChar(p)}</span>`;
    }

    // Name inside
    if (nameInside) {
      html += `<span class="palette-name" style="
        font-size: ${state.nameSize}px;
        ${getNameStyleCSS()}
        color: ${getNameColor()};
        ${getNamePositionStyle()}
      ">${p.name}</span>`;
    }

    // Determine heading and body text based on content mode
    let headingText, bodyText;
    if (state.contentMode === 'named') {
      headingText = p.name;
      bodyText = p.desc;
    } else if (state.contentMode === 'namedSame') {
      headingText = p.name;
      bodyText = state.body;
    } else {
      headingText = state.heading;
      bodyText = state.body;
    }

    // Heading
    html += `<div class="card-heading" style="
      font-family: ${p.headingFont};
      font-weight: ${p.headingWeight};
      font-size: ${state.headingSize}px;
      line-height: 1.15;
      color: ${getTextColor()};
      text-transform: ${p.headingTransform};
      letter-spacing: ${p.headingSpacing};
      margin-bottom: ${state.headingGap}px;
    ">${headingText}</div>`;

    // Body
    html += `<div class="card-body" style="
      font-family: ${p.bodyFont};
      font-weight: ${p.bodyWeight};
      font-size: ${state.bodySize}px;
      line-height: 1.45;
      color: ${getBodyTextColor()};
    ">${bodyText}</div>`;

    html += `</div>`;

    if (nameAbove) {
      html += `</div>`;
    }
  });

  list.innerHTML = html;
}

function selectPaletteCard(el) {
  document.querySelectorAll('.palette-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
}

function updatePrompt() {
  const diff = {};
  for (const key of Object.keys(DEFAULTS)) {
    if (JSON.stringify(state[key]) !== JSON.stringify(DEFAULTS[key])) {
      diff[key] = state[key];
    }
  }

  const config = {
    layout: {
      columns: +state.columns,
      gap: state.gap,
      padding: state.padding,
      background: state.bg,
      border: state.border,
      borderRadius: state.radius,
    },
    content: {
      mode: state.contentMode,
      heading: state.heading,
      body: state.body,
      headingSize: state.headingSize,
      bodySize: state.bodySize,
      bodyColor: state.bodyColor,
      headingGap: state.headingGap,
    },
    watermark: {
      show: state.watermark,
      character: state.watermarkChar,
      opacity: state.watermarkOpacity / 100,
      size: state.watermarkSize,
      position: state.watermarkPos,
    },
    paletteName: {
      show: state.showName,
      position: state.namePos,
      size: state.nameSize,
      style: state.nameStyle,
      color: state.nameColor,
    },
  };

  document.getElementById('output-text').textContent = JSON.stringify(config, null, 2);
}

function copyOutput() {
  const text = document.getElementById('output-text').textContent;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy Settings', 1500);
  });
}

function updateAll() {
  updateValueDisplays();
  // Show/hide heading and body text fields based on content mode
  const rowHeading = document.getElementById('row-heading');
  const rowBody = document.getElementById('row-body');
  if (rowHeading) rowHeading.style.display = state.contentMode === 'named' ? 'none' : (state.contentMode === 'namedSame' ? 'none' : 'flex');
  if (rowBody) rowBody.style.display = state.contentMode === 'named' ? 'none' : 'flex';
  renderPreview();
  updatePrompt();
}

// Init
updateAll();
</script>
</body>
</html>
